[package]
name = "talpid-tunnel"
edition.workspace = true
rust-version.workspace = true
description = "Library for creating tunnel devices and interfacing with various VPN tunnels"
repository.workspace = true
license.workspace = true

[dependencies]
cfg-if = "1.0"
futures = { workspace = true }
ipnetwork = { workspace = true }
log = { workspace = true }
talpid-routing = { path = "../talpid-routing" }
talpid-types = { path = "../talpid-types" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt-multi-thread", "net", "sync", "time", "macros"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
talpid-lan-forwarder = { path = "../talpid-lan-forwarder" }
nix = { workspace = true, features = ["fs"] }

[target.'cfg(any(target_os = "android", target_os = "linux"))'.dev-dependencies]
talpid-netstack = { path = "../talpid-netstack" }
nix = { workspace = true, features = ["socket"] }
socket2 = { workspace = true }
smoltcp = { version = "0.13", default-features = false, features = [
  "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "std",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tun = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jnix = { version = "0.5.1", features = ["derive"] }
talpid-error.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
netlink-packet-core.workspace = true
netlink-packet-route.workspace = true
netlink-sys.workspace = true
rtnetlink.workspace = true

[target."cfg(windows)".dependencies]
talpid-windows = { path = "../talpid-windows" }
wintun-bindings = "0.7.39"

[target."cfg(windows)".dependencies.windows-sys]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
]

[lints]
workspace = true
